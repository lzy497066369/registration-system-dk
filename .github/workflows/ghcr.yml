name: build-and-push-ghcr

# push 到 main 分支（或手动触发）时，把 backend / frontend 构建成镜像
# 推到 GitHub Container Registry（ghcr.io），服务器只拉镜像、不在服务器上编译。
# 首次运行前确认：Settings → Actions → General → Workflow permissions
# 选 "Read and write permissions"（推送镜像需要）。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # 服务器 CPU 架构，选错镜像在服务器上会报 exec format error：
  #   x86 服务器（绝大多数云主机）        -> linux/amd64
  #   ARM 服务器（部分轻量云/鲲鹏/树莓派）-> linux/arm64
  #   不确定就两个都构建（时间约翻倍）     -> linux/amd64,linux/arm64
  PLATFORMS: linux/amd64

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      # backend / frontend 各构建一个镜像，并行跑
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # GHCR 要求镜像名全小写；GitHub 用户名可能含大写，先统一转小写
      - name: 生成小写镜像名
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN 是 Actions 自动发的临时令牌，不用自己建
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LC }}-${{ matrix.name }}
          # 两个标签：latest 给日常部署；sha-提交号 用于精确回滚
          tags: |
            latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.name }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 缓存，第二次构建起明显加速
          cache-from: type=gha
          cache-to: type=gha,mode=max
