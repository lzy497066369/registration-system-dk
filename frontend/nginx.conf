server {
    listen 80;
    # 富文本内嵌图片原样上传、不压缩：单张 base64 上限 20MB，
    # 活动/剧目介绍可能一次存多张，所以留到 120MB（nginx 默认仅 1MB 会返回 413）
    client_max_body_size 120m;

    # 慢网下的主要瓶颈是 1.7MB 的 JS（原来没开 gzip，原样传输）。
    # 开了之后这类文本资源约为原来的三成，首屏能快一倍以上。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # 构建产物文件名带 hash（index-xxxx.js），内容变了名字就变，
    # 可以放心长缓存，回访时直接从本地读，不再走网络。
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不能缓存：否则发版后浏览器仍拿旧 HTML，
    # 里面引用的 hash 文件名已经不存在，表现为白屏。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # public 下的图片文件名固定不变，给 7 天缓存（换图后最多 7 天生效）
    location /images/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
